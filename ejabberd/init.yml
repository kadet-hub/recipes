classes:
  - .ejabberd
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    ejabberd:
      # The target sets admin_password and erlang_cookie.
      # The XMPP domain, example.com as in the compose example.
      host: example.com
      component_defaults:
        # Compose injects no service link variables.
        enable_service_links: false
