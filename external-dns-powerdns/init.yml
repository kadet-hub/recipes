classes:
  - .external-dns-powerdns
  - recipes.powerdns
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
      # The chart installs these CRDs from crds/ with every release.
      - input_type: copy
        input_paths:
          # crds/ of the chart archive in the README's Source line, Apache-2.0:
          # SHA-256 96f4383d550a04d7c78b3312edc6e0f9dab9777d8195ff4cfdc76a0ca9587bbe
          - inventory/classes/recipes/external-dns-powerdns/vendor/dnsendpoints.externaldns.k8s.io.yaml
          # SHA-256 bad8879419bac5393b52f2dfff43b0915048e9ae2abab25f926f2f00b20bb132
          - inventory/classes/recipes/external-dns-powerdns/vendor/dnsrecords.externaldns.k8s.io.yaml
        output_path: manifests/
