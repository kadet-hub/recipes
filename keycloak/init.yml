classes:
  - .keycloak
  - recipes.postgresql
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/keycloak:1.1.0@sha256:7c7d3aa29b5cca627c868b166f3ed00979e04c99d01e71f2a33bd35d4393ecc4
        output_path: lib/keycloak
      - type: oci
        source: ghcr.io/kadet-hub/certmanager:1.0.2@sha256:ba7632e9e06a593fbe20e9fa6774139203d7df65992adff9db94779606888ad9
        output_path: lib/certmanager
    compile:
      - input_type: kadet
        input_paths:
          - lib/keycloak
        output_path: manifests/
        output_type: yml
      - input_type: kadet
        input_paths:
          - lib/certmanager
        output_path: manifests/
        output_type: yml
  applications:
    keycloak:
      name: keycloak
      # The target sets host, the host name Keycloak serves, and issuer, the
      # name and kind of the cert-manager issuer of its certificate.
