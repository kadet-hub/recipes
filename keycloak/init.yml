classes:
  - .keycloak
  - recipes.postgresql
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/keycloak:1.1.2@sha256:b6bf83ce3c7bea6d61214764a9de503a8f36daa84d7925a81a54465fecec7c25
        output_path: lib/keycloak
      - type: oci
        source: ghcr.io/kadet-hub/certmanager:1.1.0@sha256:a1aac8168deabcca1fd857bd1f404cce138e65542718ad8441e45baccad1522f
        output_path: lib/certmanager
    compile:
      - input_type: kadet
        input_paths:
          - lib/keycloak
        output_path: manifests/
        output_type: yml
      - input_type: kadet
        input_paths:
          - lib/certmanager
        output_path: manifests/
        output_type: yml
  applications:
    keycloak:
      name: keycloak
      # The target sets host, the host name Keycloak serves, and issuer, the
      # name and kind of the cert-manager issuer of its certificate.
