parameters:
  generators:
    keycloak:
      instances:
        keycloak:
          name: ${applications.keycloak.name}
          instances: 1
          # renovate: Source
          image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          spec:
            # With an image set, the operator starts it with --optimized,
            # and the project's image is not built for PostgreSQL.
            startOptimized: false
          # The Service, the database and the Secret of the included recipe
          # postgresql.
          db:
            vendor: postgres
            host: ${applications.postgresql.cluster}-rw
            database: ${applications.postgresql.database}
            credentials_secret: ${applications.postgresql.cluster}-app
          hostname:
            hostname: https://${applications.keycloak.host}
          http:
            tls_secret: keycloak-tls
          ingress:
            enabled: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
    certmanager:
      certs:
        keycloak-tls:
          spec:
            secretName: keycloak-tls
            # Keycloak rejected a self-signed certificate with an empty
            # issuer DN in kadet-hub/examples.
            commonName: ${applications.keycloak.host}
            issuerRef: ${applications.keycloak.issuer}
            dnsNames:
              - ${applications.keycloak.host}
              - ${applications.keycloak.name}-service.${namespace}.svc
