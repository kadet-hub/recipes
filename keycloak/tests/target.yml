classes:
  - recipes.keycloak
  - recipes.keycloak.route
parameters:
  namespace: keycloak
  kapitan:
    vars:
      target: keycloak
  applications:
    keycloak:
      host: keycloak.example.org
      issuer:
        name: keycloak-selfsigned
        kind: Issuer
      # The Gateway of check.
      gateway:
        name: gateway
        namespace: gateway
        section: http
  generators:
    certmanager:
      issuers:
        keycloak-selfsigned:
          spec:
            selfSigned: {}
