classes:
  - recipes.postgresql
  - .semaphore
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.14.0@sha256:787129e1eaed6b9bc868fe4c4aec58d40de6a89fc3cc08424a4cb5822b855080
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    semaphore:
      # The target sets admin.username, admin.password, cookie_hash,
      # cookie_encryption, access_key_encryption and runner_token.
      admin:
        fullname: Admin
        email: admin@localhost
