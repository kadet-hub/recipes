name: tools
description: The pinned binaries check runs, verified by SHA-256.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }} # gh release download (RCP-28)
        # Renovate moves the version only: set the SHA-256 from
        # https://dl.k8s.io/release/<version>/bin/linux/amd64/kubectl.sha256.
        # renovate: datasource=github-releases depName=kubernetes/kubernetes
        KUBECTL_VERSION: v1.37.2
        KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
        # Renovate moves the version only: set the SHA-256 from
        # https://get.helm.sh/helm-<version>-linux-amd64.tar.gz.sha256sum.
        # renovate: datasource=github-releases depName=helm/helm
        HELM_VERSION: v4.3.1
        HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        # renovate: datasource=github-release-attachments depName=oras-project/oras
        ORAS_VERSION: v1.3.5
        ORAS_SHA256: f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22
        # renovate: datasource=github-release-attachments depName=cli/cli
        GH_VERSION: v2.103.3
        GH_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        # gateway-api of check (RCP-55).
        # renovate: datasource=github-release-attachments depName=kubernetes-sigs/cloud-provider-kind
        CLOUD_PROVIDER_KIND_VERSION: v0.12.0
        CLOUD_PROVIDER_KIND_SHA256: 5716aca8f01a85172c12f3b6329c70f151bec02c91b6f600c9f230845ee138e6
      run: | # zizmor: ignore[github-env] it appends only $RUNNER_TEMP/bin to GITHUB_PATH
        set -euo pipefail
        bin=$RUNNER_TEMP/bin
        mkdir -p "$bin" "$RUNNER_TEMP/dl"
        cd "$RUNNER_TEMP/dl"
        get() { curl -fsSLo "$2" "$1" && echo "$3  $2" | sha256sum -c --quiet; }
        # <repo> <tag> <asset> <file> <sha256>: through the API with the job's token (RCP-28).
        release() { gh release download "$2" -R "$1" -p "$3" -O "$4" && echo "$5  $4" | sha256sum -c --quiet; }
        get "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" "$bin/kubectl" "$KUBECTL_SHA256"
        get "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" helm.tgz "$HELM_SHA256"
        tar -xzf helm.tgz -C "$bin" --strip-components=1 linux-amd64/helm
        release oras-project/oras "$ORAS_VERSION" "oras_${ORAS_VERSION#v}_linux_amd64.tar.gz" oras.tgz "$ORAS_SHA256"
        tar -xzf oras.tgz -C "$bin" oras
        gh=gh_${GH_VERSION#v}_linux_amd64
        release cli/cli "$GH_VERSION" "$gh.tar.gz" gh.tgz "$GH_SHA256"
        tar -xzf gh.tgz -C "$bin" --strip-components=2 "$gh/bin/gh"
        release kubernetes-sigs/cloud-provider-kind "$CLOUD_PROVIDER_KIND_VERSION" "cloud-provider-kind_${CLOUD_PROVIDER_KIND_VERSION#v}_linux_amd64.tar.gz" cpk.tgz "$CLOUD_PROVIDER_KIND_SHA256"
        tar -xzf cpk.tgz -C "$bin" cloud-provider-kind
        chmod +x "$bin"/*
        echo "$bin" >> "$GITHUB_PATH"
