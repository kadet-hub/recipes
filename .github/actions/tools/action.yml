name: tools
description: The pinned binaries check runs, verified by SHA-256.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        bin=$RUNNER_TEMP/bin
        mkdir -p "$bin" "$RUNNER_TEMP/dl"
        cd "$RUNNER_TEMP/dl"
        get() { curl -fsSLo "$2" "$1" && echo "$3  $2" | sha256sum -c --quiet; }
        get https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 "$bin/kind" \
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        get https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl "$bin/kubectl" \
          65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
        get https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz helm.tgz \
          0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        tar -xzf helm.tgz -C "$bin" --strip-components=1 linux-amd64/helm
        get https://github.com/oras-project/oras/releases/download/v1.3.5/oras_1.3.5_linux_amd64.tar.gz oras.tgz \
          f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22
        tar -xzf oras.tgz -C "$bin" oras
        get https://github.com/cli/cli/releases/download/v2.103.1/gh_2.103.1_linux_amd64.tar.gz gh.tgz \
          57500f347b5e84efb6578c9b644eeb3b4e54046762635a939dd0ee2cca1c1add
        tar -xzf gh.tgz -C "$bin" --strip-components=2 gh_2.103.1_linux_amd64/bin/gh
        chmod +x "$bin"/*
        echo "$bin" >> "$GITHUB_PATH"
