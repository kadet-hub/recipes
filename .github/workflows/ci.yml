name: ci

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# Pins Renovate moves (RCP-30).
env:
  # renovate: datasource=github-release-attachments depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
  ZIZMOR_VERSION: v1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - name: Unit tests of check
        run: uv run --locked --project check python -m unittest discover -s check/tests -t check -v
      - name: actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c --quiet
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  # The recipes this run checks, each at the level its README states
  # (RCP-13, RCP-28).
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      recipes: ${{ steps.select.outputs.recipes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # On pull_request, HEAD is the merge commit and HEAD^1 the base.
          changed=$(if [[ $EVENT == pull_request ]]; then git diff --name-only HEAD^1 HEAD; fi)
          all=
          if [[ $EVENT != pull_request ]] || grep -qE '^(check|\.github)/' <<<"$changed"; then all=1; fi
          for init in */init.yml; do
            name=${init%/init.yml}
            # A recipe is also checked when a recipe it includes changes (RCP-50).
            included=$(grep -hoE '^ *- recipes\.[a-z0-9-]+' "$name"/*.yml | sed 's/.*recipes\.//' | grep -vx "$name" | sort -u | paste -sd'|' || true)
            if [[ $all ]] || grep -q "^$name/" <<<"$changed" || { [[ $included ]] && grep -qE "^($included)/" <<<"$changed"; }; then
              level=$(sed -n 's/^Level: .\(.*\).$/\1/p' "$name/README.md")
              jq -nc --arg name "$name" --arg level "$level" '{name: $name, level: $level}'
            fi
          done | jq -sc . | sed 's/^/recipes=/' >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lint:
    needs: select
    if: needs.select.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.select.outputs.recipes) }}
    name: lint ${{ matrix.recipe.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - uses: ./.github/actions/tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ matrix.recipe.name }}
        run: uv run --locked --project check check/check.py lint "$RECIPE"

  check:
    needs: [select, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.select.outputs.recipes) }}
    name: check ${{ matrix.recipe.name }} --level ${{ matrix.recipe.level }}
    # deploys and migrates run a fork's manifests on kind in this runner:
    # they wait for a maintainer's approval (RCP-20).
    environment: ${{ github.event.pull_request.head.repo.fork && matrix.recipe.level != 'renders' && 'fork-pull-request' || '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - uses: ./.github/actions/tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ matrix.recipe.name }}
          LEVEL: ${{ matrix.recipe.level }}
        run: |
          status=0
          uv run --locked --project check check/check.py "$RECIPE" --level "$LEVEL" --report report.txt || status=$?
          { echo '```text'; cat report.txt 2>/dev/null || echo "no report, exit $status"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Advisories in check's lock and findings in the workflows (RCP-68).
  deps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - name: pip-audit
        run: |
          uv export --locked --project check --all-groups --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked --project check --only-group audit pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: zizmor
        # Runs after a pip-audit failure too: the two gates are independent.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSLo zizmor.tgz "https://github.com/zizmorcore/zizmor/releases/download/$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  zizmor.tgz" | sha256sum -c --quiet
          tar -xzf zizmor.tgz zizmor
          ./zizmor --format plain .github

  # The one required check of the main ruleset (RCP-65).
  ci:
    needs: [test, select, lint, check, deps]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qwE 'failure|cancelled' <<<"$RESULTS"
