name: ci

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

# A push to a pull request cancels the run of its previous head; other runs get a group of their own (RCP-422).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Pins Renovate moves (RCP-30).
env:
  # renovate: datasource=github-release-attachments depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
  ZIZMOR_VERSION: v1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: Unit tests of check
        run: uv run --locked --project check python -m unittest discover -s check/tests -t check -v
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ACTIONLINT_VERSION" -R rhysd/actionlint -p "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" -O actionlint.tgz
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c --quiet
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  # The recipes this run checks, each at the level its README states, with the
  # recipes that include or require a changed one (RCP-13, RCP-13a, RCP-28, RCP-50 to RCP-50b).
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      recipes: ${{ steps.select.outputs.recipes }}
      all: ${{ steps.select.outputs.all }}
      kind: ${{ steps.kubernetes.outputs.kind }}
      kubernetes: ${{ steps.kubernetes.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # On pull_request, HEAD is the merge commit and HEAD^1 the base; every recipe otherwise.
          base=()
          if [[ $EVENT == pull_request ]]; then base=(HEAD^1); fi
          uv run --locked --project check check/check.py select "${base[@]}" | tee -a "$GITHUB_OUTPUT"
      # The Kubernetes minors check runs on, with their node images and kind (RCP-70).
      - id: kubernetes
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://raw.githubusercontent.com/kadet-hub/renovate-config/843255e023682724c3325f287bafbf061a1c8b6f/kubernetes-versions.json # kubernetes-versions-2026-11-02
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$URL" | jq -r '"kind=\(.kind | tojson)", "kubernetes=\(.kubernetes | tojson)"' | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: select
    if: needs.select.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.select.outputs.recipes) }}
    name: lint ${{ matrix.recipe.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - uses: ./.github/actions/tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ matrix.recipe.name }}
        run: uv run --locked --project check check/check.py lint "$RECIPE"

  check:
    needs: [select, lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.select.outputs.recipes) }}
        kubernetes: ${{ fromJSON(needs.select.outputs.kubernetes) }}
    name: check ${{ matrix.recipe.name }} --level ${{ matrix.recipe.level }} on ${{ matrix.kubernetes.minor }}
    # deploys and migrates run a fork's manifests on kind in this runner:
    # they wait for a maintainer's approval (RCP-20).
    environment: ${{ github.event.pull_request.head.repo.fork && matrix.recipe.level != 'renders' && 'fork-pull-request' || '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - uses: ./.github/actions/tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
      # The kind release that built the node images (RCP-70).
      - env:
          GH_TOKEN: ${{ github.token }}
          KIND_VERSION: ${{ fromJSON(needs.select.outputs.kind).version }}
          KIND_SHA256: ${{ fromJSON(needs.select.outputs.kind).sha256['linux-amd64'] }}
        run: |
          gh release download "$KIND_VERSION" -R kubernetes-sigs/kind -p kind-linux-amd64 -O "$RUNNER_TEMP/bin/kind"
          echo "$KIND_SHA256  $RUNNER_TEMP/bin/kind" | sha256sum -c --quiet
          chmod +x "$RUNNER_TEMP/bin/kind"
      # Runners on AWS start with 17 GB free, too little for paperless-ai's
      # image in kind (RCP-271, DEC-195).
      - run: |
          df -h /
          if (( $(df -B1G --output=avail / | tail -1) < 30 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            df -h /
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ matrix.recipe.name }}
          LEVEL: ${{ matrix.recipe.level }}
          NODE_IMAGE: ${{ matrix.kubernetes.node_image }}
        run: |
          status=0
          uv run --locked --project check check/check.py "$RECIPE" --level "$LEVEL" --node-image "$NODE_IMAGE" --report report.txt || status=$?
          { echo '```text'; cat report.txt 2>/dev/null || echo "no report, exit $status"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # kadet-convert on podinfo, proven on kind on the newest minor, whenever every recipe is checked
  # (converter.md CNV-19).
  convert:
    needs: select
    if: needs.select.outputs.all == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - uses: ./.github/actions/tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/; the workspace is the main checkout
      - env:
          GH_TOKEN: ${{ github.token }}
          KIND_VERSION: ${{ fromJSON(needs.select.outputs.kind).version }}
          KIND_SHA256: ${{ fromJSON(needs.select.outputs.kind).sha256['linux-amd64'] }}
        run: |
          gh release download "$KIND_VERSION" -R kubernetes-sigs/kind -p kind-linux-amd64 -O "$RUNNER_TEMP/bin/kind"
          echo "$KIND_SHA256  $RUNNER_TEMP/bin/kind" | sha256sum -c --quiet
          chmod +x "$RUNNER_TEMP/bin/kind"
      - env:
          GH_TOKEN: ${{ github.token }}
          NODE_IMAGE: ${{ fromJSON(needs.select.outputs.kubernetes)[0].node_image }}
          CHART: oci://ghcr.io/stefanprodan/charts/podinfo@sha256:258d0da545724b4eea8de5d5e724cd9a75aab3de79a87ba8d82ec402745cea58
        run: |
          status=0
          uv run --locked --project check check/convert.py "$CHART" --name podinfo --namespace podinfo \
            -f check/tests/fixtures/convert/podinfo-values.yaml --out "$RUNNER_TEMP/podinfo" --node-image "$NODE_IMAGE" >/dev/null || status=$?
          cat "$RUNNER_TEMP/podinfo/report.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report, exit $status" >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Advisories in check's lock and findings in the workflows (RCP-68).
  deps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: false
      - name: pip-audit
        run: |
          uv export --locked --project check --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked --project check --only-group audit pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: zizmor
        # Runs after a pip-audit failure too: the two gates are independent.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ZIZMOR_VERSION" -R zizmorcore/zizmor -p zizmor-x86_64-unknown-linux-gnu.tar.gz -O zizmor.tgz
          echo "$ZIZMOR_SHA256  zizmor.tgz" | sha256sum -c --quiet
          tar -xzf zizmor.tgz zizmor
          ./zizmor --format plain .github

  # A change under check/, outside its tests, raises check's VERSION (RCP-406).
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: |
          set -euo pipefail
          # HEAD is the merge commit and HEAD^1 the base.
          if git diff --quiet HEAD^1 HEAD -- check ':!check/tests'; then exit 0; fi
          version() { git show "$1:check/check.py" | grep '^VERSION = '; }
          if [[ $(version HEAD^1) == "$(version HEAD)" ]]; then
            echo "::error file=check/check.py::files under check/ outside check/tests/ changed, VERSION did not (RCP-406)"
            exit 1
          fi

  # The one required check of the main ruleset (RCP-65, RCP-65a).
  ci:
    needs: [test, select, lint, check, convert, deps, version]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RECIPES: ${{ needs.select.outputs.recipes }}
          ALL: ${{ needs.select.outputs.all }}
          LINT: ${{ needs.lint.result }}
          CHECK: ${{ needs.check.result }}
          CONVERT: ${{ needs.convert.result }}
        run: |
          echo "$RESULTS"
          if grep -qwE 'failure|cancelled' <<<"$RESULTS"; then exit 1; fi
          # A skip passes only where select chose nothing for the job.
          if [[ $RECIPES != '[]' && ( $LINT != success || $CHECK != success ) ]]; then
            echo "::error::select chose recipes, lint is $LINT and check is $CHECK"
            exit 1
          fi
          if [[ $ALL == 1 && $CONVERT != success ]]; then
            echo "::error::select chose every recipe, convert is $CONVERT"
            exit 1
          fi
