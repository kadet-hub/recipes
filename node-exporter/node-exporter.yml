parameters:
  components:
    node-exporter-prometheus-node-exporter:
      application: node-exporter
      type: daemonset
      image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
      args:
        procfs: --path.procfs=/host/proc
        sysfs: --path.sysfs=/host/sys
        rootfs: --path.rootfs=/host/root
        udev: --path.udev.data=/host/root/run/udev/data
        listen-address: --web.listen-address=[$(HOST_IP)]:9100
        mount-points-exclude: --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        fs-types-exclude: --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      env:
        HOST_IP: 0.0.0.0
      ports:
        metrics:
          service_port: 9100
      service:
        annotations:
          prometheus.io/scrape: "true"
      healthcheck:
        liveness:
          type: http
          port: metrics
          path: /
          timeout_seconds: 5
        readiness:
          type: http
          port: metrics
          path: /
          timeout_seconds: 5
      service_account:
        create: true
      host_network: true
      host_pid: true
      workload_security_context:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      security_context:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        proc:
          hostPath:
            path: /proc
        sys:
          hostPath:
            path: /sys
        root:
          hostPath:
            path: /
      volume_mounts:
        proc:
          mount_path: /host/proc
          read_only: true
        sys:
          mount_path: /host/sys
          read_only: true
        root:
          mount_path: /host/root
          read_only: true
          mount_propagation: HostToContainer
      pod_annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      node_selector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - fargate
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
