# The chart side of the comparison tests, as the API server returns it.
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
metadata:
  name: demo
  namespace: demo
  uid: 0b6f6d6e-0000-0000-0000-000000000001
  labels:
    app.kubernetes.io/name: demo
    helm.sh/chart: demo-1.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  resourceVersion: "42"
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/instance: demo
        sidecar.istio.io/inject: "false"
      annotations:
        prometheus.io/port: "9402"
    spec:
      serviceAccountName: demo
      containers:
        - name: demo-controller
          image: registry.example.org/demo:v1.0.0
          args:
            - --solver-image=registry.example.org/solver:v1.0.0
          ports:
            - name: https
              containerPort: 10250
              protocol: TCP
            - name: http-metrics
              containerPort: 9402
              protocol: TCP
status:
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
  labels:
    app.kubernetes.io/name: demo
spec:
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
  ports:
    - name: http-metrics
      port: 9402
      targetPort: 9402
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: demo-webhook
webhooks:
  - name: webhook.demo.example.org
    sideEffects: None
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: demo
        namespace: demo
        path: /validate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo:readers
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: demo-readers
