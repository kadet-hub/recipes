[project]
name = "recipes-check"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "kapitan[omegaconf,reclass-rs]==0.36.3",
  "omegaconf==2.4.0.dev4",
  "pyyaml==6.0.3",
]

# kadet-convert, run with uvx from a check-vX.Y.Z tag (docs/specs/converter.md DEC-183).
[project.scripts]
kadet-convert = "convert:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["check", "compare", "convert", "lint"]

[dependency-groups]
# The deps job of CI (RCP-68).
audit = ["pip-audit==2.10.1"]

[tool.uv]
# RCP-67: kapicorp/kapitan#1632 raises Kapitan's cap of <49.
override-dependencies = ["cryptography>=50.0.0"]
