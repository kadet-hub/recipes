parameters:
  components:
    memcached:
      application: memcached
      # renovate: Source
      image: docker.io/library/memcached:1.6.45@sha256:a395a1bcf5e0e2b0fa4a0142e12b4e24a2320ba4b7c6ffa8655a1a86e8f29dee
      security_profile: restricted
      read_only_root_filesystem: true
      # The image runs as the user memcache, UID 11211 in its /etc/passwd.
      workload_security_context:
        runAsUser: 11211
        runAsGroup: 11211
      ports:
        memcache:
          service_port: 11211
      healthcheck:
        readiness:
          type: tcp
          port: memcache
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 192Mi
      service:
        type: ClusterIP
