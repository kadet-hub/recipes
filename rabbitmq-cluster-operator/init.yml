      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
      - type: oci
        source: ghcr.io/kadet-hub/certmanager:1.1.0@sha256:a1aac8168deabcca1fd857bd1f404cce138e65542718ad8441e45baccad1522f
        output_path: lib/certmanager
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
      - input_type: kadet
        input_paths:
          - lib/certmanager
        output_path: manifests/
        output_type: yml
      - input_type: copy
        input_paths:
          # SHA-256 6203b7216bbb76aa6eeedc8ee3d07e4750b8ed66c9498346e6098be9a89c309e
          # from https://github.com/rabbitmq/cluster-operator/blob/v2.23.1/config/crd/bases/rabbitmq.com_rabbitmqclusters.yaml
          - inventory/classes/recipes/rabbitmq-cluster-operator/vendor/rabbitmq.com_rabbitmqclusters.yaml
        output_path: manifests/
