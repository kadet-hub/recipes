parameters:
  components:
    open-archiver:
      application: open-archiver
      type: statefulset
      # renovate: upstream
      image: docker.io/logiclabshq/open-archiver:v0.6.2@sha256:ec2e954959f7d0ee0089c4338437720da9b85520a23779cb6d7642943b3ae8e5
      ports:
        http:
          container_port: 3000
          service_port: 3000
      service:
        type: ClusterIP
      # .env.example, which the documentation copies to the env_file .env.
      env:
        NODE_ENV: development
        PORT_BACKEND: "4000"
        PORT_FRONTEND: "3000"
        APP_URL: ${applications.open-archiver.app_url}
        ORIGIN: ${applications.open-archiver.app_url}
        SYNC_FREQUENCY: "* * * * *"
        ALL_INCLUSIVE_ARCHIVE: "false"
        ARCHIVE_DRAFTS: "false"
        INGESTION_WORKER_CONCURRENCY: "5"
        INGESTION_EMAIL_CONCURRENCY: "3"
        DATABASE_URL:
          secretKeyRef:
            name: ${applications.postgresql.cluster}-app
            key: uri
        MEILI_MASTER_KEY:
          secretKeyRef:
            key: MEILI_MASTER_KEY
        MEILI_HOST: http://open-archiver-meilisearch:7700
        MEILI_INDEXING_BATCH: "500"
        MEILI_INDEXING_CHUNK: "25"
        INDEXING_MAX_TEXT_BYTES: "1000000"
        INDEXING_WORKER_CONCURRENCY: "4"
        INDEXING_WORKER_MAX_OLD_SPACE_MB: "2048"
        REDIS_HOST: valkey
        REDIS_PORT: "6379"
        REDIS_PASSWORD:
          secretKeyRef:
            name: valkey-auth
            key: default-password
        REDIS_TLS_ENABLED: "false"
        STORAGE_TYPE: local
        BODY_SIZE_LIMIT: 100M
        STORAGE_LOCAL_ROOT_PATH: /var/data/open-archiver
        STORAGE_S3_ENDPOINT: ""
        STORAGE_S3_BUCKET: ""
        STORAGE_S3_ACCESS_KEY_ID: ""
        STORAGE_S3_SECRET_ACCESS_KEY: ""
        STORAGE_S3_REGION: ""
        STORAGE_S3_FORCE_PATH_STYLE: "false"
        STORAGE_ENCRYPTION_KEY: ""
        ENABLE_DELETION: "false"
        RATE_LIMIT_WINDOW_MS: "60000"
        RATE_LIMIT_MAX_REQUESTS: "100"
        JWT_SECRET:
          secretKeyRef:
            key: JWT_SECRET
        JWT_EXPIRES_IN: 7d
        ENCRYPTION_KEY:
          secretKeyRef:
            key: ENCRYPTION_KEY
        TIKA_URL: http://open-archiver-tika:9998
        PDF_PARSE_TIMEOUT_MS: "20000"
        PDF_PARSE_HEAP_BUDGET_RATIO: "0.25"
        RETENTION_BATCH_SIZE: "100"
        SMTP_JOURNALING_PORT: "2525"
        SMTP_JOURNALING_DOMAIN: journal.yourdomain.com
        JOURNAL_QUEUE_BACKPRESSURE_THRESHOLD: "10000"
        JOURNAL_WORKER_CONCURRENCY: "3"
        OA_LICENSE_KEY: ""
      secrets:
        credentials:
          string_data:
            JWT_SECRET:
              value: ${applications.open-archiver.jwt_secret}
            ENCRYPTION_KEY:
              value: ${applications.open-archiver.encryption_key}
            MEILI_MASTER_KEY:
              value: ${applications.open-archiver.meili_master_key}
      volume_mounts:
        archiver-data:
          mount_path: /var/data/open-archiver
      volume_claims:
        archiver-data:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
