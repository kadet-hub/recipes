classes:
  - recipes.postgresql
  - .synapse
  - .admin
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    matrix-synapse:
      # The target sets server_name, registration_shared_secret,
      # admin.username and admin.password.
      public_baseurl: https://${applications.matrix-synapse.server_name}/
      # Federation off: the listener serves the client API only, and the
      # empty list denies federation with every server. The option
      # federation replaces this file of the ConfigMap matrix-synapse.
      federation: |
        listeners:
          - port: ${components.matrix-synapse.ports.http.container_port}
            type: http
            x_forwarded: true
            resources:
              - names:
                  - client
        federation_domain_whitelist: []
        trusted_key_servers: []
      component_defaults:
        security_profile: restricted
