classes:
  - recipes.postgresql
  - .forgejo
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    forgejo:
      # The target sets admin.username, admin.password and secret_key.
      admin:
        email: gitea@local.domain
      # The chart's version label, the tag of the image in forgejo.yml.
      labels:
        version: 15.0.11
      # The mount path of the chart's script Secrets.
      scripts: /usr/sbin
