classes:
  - .litellm
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.14.0@sha256:787129e1eaed6b9bc868fe4c4aec58d40de6a89fc3cc08424a4cb5822b855080
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    litellm:
      # The proxy's config.yaml. The target sets model_list, the models the
      # proxy routes to, and master_key.
      config:
        model_list: ${applications.litellm.model_list}
        general_settings:
          master_key: os.environ/PROXY_MASTER_KEY
