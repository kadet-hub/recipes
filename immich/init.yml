classes:
  - recipes.postgresql
  - recipes.postgresql.pgvector
  - recipes.postgresql.earthdistance
  - recipes.valkey
  - .server
  - .machine-learning
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    immich:
      library_storage: 10Gi
      component_defaults:
        revision_history_limit: 3
        enable_service_links: false
        # The chart leaves the ServiceAccount's token at the API default,
        # true, and the pod's at false.
        service_account:
          create: true
          automount_service_account_token: true
        # The label the chart's library puts on its controller main.
        labels:
          app.kubernetes.io/controller: main
        pod_labels:
          app.kubernetes.io/controller: main
