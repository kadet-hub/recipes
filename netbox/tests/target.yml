      superuser:
        name: admin
        email: admin@example.com
        password: smoke-password
      secret_key: smoke-secret-key-smoke-secret-key-smoke-secret-key-smoke
      api_token_pepper: smoke-pepper-smoke-pepper-smoke-pepper-smoke-pepper-smoke
