backends:
  - omegaconf
required:
  - path: applications.velero.s3.access_key_id
    description: S3 access key ID with which Velero and the node agent reach the buckets of the backup storage locations.
    secret: true
  - path: applications.velero.s3.secret_access_key
    description: S3 secret access key that belongs to applications.velero.s3.access_key_id.
    secret: true
