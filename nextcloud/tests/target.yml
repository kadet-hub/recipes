classes:
  - recipes.nextcloud
  - recipes.nextcloud.mail
parameters:
  namespace: nextcloud
  kapitan:
    vars:
      target: nextcloud
  # The values tests/values.yaml gives the chart, and the Gateway of check.
  applications:
    nextcloud:
      host: nextcloud.example.com
      admin:
        password: smoke-password
      gateway:
        name: gateway
        namespace: gateway
        section: http
      # The smoke test sends no mail.
      mail:
        from_address: nextcloud
        domain: example.com
        smtp:
          host: smtp.example.com
          name: nextcloud
          password: smoke-password
    valkey:
      password: smoke-password
    # One instance is enough for the proof.
    postgresql:
      instances: 1
