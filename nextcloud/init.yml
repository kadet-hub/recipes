classes:
  - recipes.postgresql
  - recipes.valkey
  - .nextcloud
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.8.0@sha256:5ff4e555c26af0e8e4edf7055e74e20c92cea644ea8dd97cb3db9c590f4d5090
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    nextcloud:
      version: 35.0.2
      # The target sets host, admin.password, gateway.name and
      # gateway.namespace.
      admin:
        username: admin
      gateway:
        section: ~
