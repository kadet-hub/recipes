parameters:
  components:
    miniflux-db:
      application: miniflux
      type: statefulset
      image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      ports:
        postgresql:
          service_port: 5432
      service:
        type: ClusterIP
      env:
        POSTGRES_USER: ${applications.miniflux.database.user}
        POSTGRES_PASSWORD:
          secretKeyRef:
            key: POSTGRES_PASSWORD
        POSTGRES_DB: ${applications.miniflux.database.name}
      secrets:
        credentials:
          string_data:
            POSTGRES_PASSWORD:
              value: ${applications.miniflux.database.password}
      healthcheck:
        readiness:
          type: command
          command:
            - pg_isready
            - -U
            - ${applications.miniflux.database.user}
          period_seconds: 10
          timeout_seconds: 30
      volume_mounts:
        miniflux-db:
          mount_path: /var/lib/postgresql
      volume_claims:
        miniflux-db:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
