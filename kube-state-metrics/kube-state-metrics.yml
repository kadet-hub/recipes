parameters:
  components:
    kube-state-metrics:
      application: kube-state-metrics
      image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      args:
        port: --port=8080
        resources: --resources=certificatesigningrequests,configmaps,cronjobs,daemonsets,deployments,endpointslices,horizontalpodautoscalers,ingresses,jobs,leases,limitranges,mutatingwebhookconfigurations,namespaces,networkpolicies,nodes,persistentvolumeclaims,persistentvolumes,poddisruptionbudgets,pods,replicasets,replicationcontrollers,resourcequotas,secrets,services,statefulsets,storageclasses,validatingwebhookconfigurations,volumeattachments
      ports:
        http:
          service_port: 8080
          # The chart sets no appProtocol.
          app_protocol: ""
        # The telemetry port, kube-state-metrics' own metrics. The chart's
        # Service leaves it out unless selfMonitor.enabled is set.
        metrics:
          container_port: 8081
      service:
        annotations:
          prometheus.io/scrape: "true"
      healthcheck:
        liveness:
          type: http
          port: http
          path: /livez
          initial_delay_seconds: 5
        readiness:
          type: http
          port: metrics
          path: /readyz
          initial_delay_seconds: 5
      service_account:
        create: true
        automount_service_account_token: true
      automount_service_account_token: true
      workload_security_context:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      security_context:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      node_selector:
        kubernetes.io/os: linux
  generators:
    kubernetes:
      rbac:
        kube-state-metrics:
          cluster_wide: true
          service_accounts:
            - ${namespace}/kube-state-metrics
          rules:
            - apiGroups:
                - certificates.k8s.io
              resources:
                - certificatesigningrequests
              verbs:
                - list
                - watch
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - list
                - watch
            - apiGroups:
                - batch
              resources:
                - cronjobs
              verbs:
                - list
                - watch
            - apiGroups:
                - apps
              resources:
                - daemonsets
              verbs:
                - list
                - watch
            - apiGroups:
                - apps
              resources:
                - deployments
              verbs:
                - list
                - watch
            - apiGroups:
                - discovery.k8s.io
              resources:
                - endpointslices
              verbs:
                - list
                - watch
            - apiGroups:
                - autoscaling
              resources:
                - horizontalpodautoscalers
              verbs:
                - list
