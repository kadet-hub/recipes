classes:
  - recipes.postgresql
  # GitLab's setup runs db:create (DEC-360).
  - recipes.postgresql.createdb
  - recipes.valkey
  - .gitlab
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.14.0@sha256:787129e1eaed6b9bc868fe4c4aec58d40de6a89fc3cc08424a4cb5822b855080
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    gitlab:
      # The target sets host and the six keys of the Secret gitlab.
      component_defaults:
        # Compose injects no service link variables.
        enable_service_links: false
