parameters:
  components:
    gitlab:
      application: gitlab
      type: statefulset
      # linux/amd64 only: sameersbn/gitlab is built for no other platform.
      # renovate: upstream
      image: docker.io/sameersbn/gitlab:19.5.5@sha256:65b58defc2d1bf864b32532a28a848f88e6459ab7dcee43ba046c19ff1e9db04
      # Port 80 of nginx only, no SSH (DEC-356).
      ports:
        http:
          service_port: 80
      service:
        type: ClusterIP
      # The service gitlab's environment, in its order. Credentials come from
      # Secrets, and those of SMTP, IMAP and OAuth, which are off, are left
      # out.
      env:
        DEBUG: "false"
        DB_ADAPTER: postgresql
        DB_HOST:
          secretKeyRef:
            name: ${applications.postgresql.cluster}-app
            key: host
        DB_PORT: "5432"
        DB_USER:
          secretKeyRef:
            name: ${applications.postgresql.cluster}-app
            key: username
        DB_PASS:
          secretKeyRef:
            name: ${applications.postgresql.cluster}-app
            key: password
        DB_NAME:
          secretKeyRef:
            name: ${applications.postgresql.cluster}-app
            key: dbname
        REDIS_HOST: valkey
        REDIS_PORT: "6379"
        # Read by the template of resque.yml below (DEC-357).
        REDIS_PASSWORD:
          secretKeyRef:
            name: valkey-auth
            key: default-password
        TZ: Asia/Kolkata
        GITLAB_TIMEZONE: Kolkata
        GITLAB_HTTPS: "false"
        SSL_SELF_SIGNED: "false"
        GITLAB_HOST: ${applications.gitlab.host}
        # Empty: 80, or 443 with GITLAB_HTTPS, and 22 (DEC-356).
        GITLAB_PORT: ""
        GITLAB_SSH_PORT: ""
        GITLAB_RELATIVE_URL_ROOT: ""
        GITLAB_SECRETS_DB_KEY_BASE:
          secretKeyRef:
            key: GITLAB_SECRETS_DB_KEY_BASE
        GITLAB_SECRETS_SECRET_KEY_BASE:
          secretKeyRef:
            key: GITLAB_SECRETS_SECRET_KEY_BASE
        GITLAB_SECRETS_OTP_KEY_BASE:
          secretKeyRef:
            key: GITLAB_SECRETS_OTP_KEY_BASE
        GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
          secretKeyRef:
            key: GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
          secretKeyRef:
            key: GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
          secretKeyRef:
            key: GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        GITLAB_ROOT_EMAIL: ""
        GITLAB_NOTIFY_ON_BROKEN_BUILDS: "true"
        GITLAB_NOTIFY_PUSHER: "false"
        GITLAB_EMAIL: notifications@example.com
        GITLAB_EMAIL_REPLY_TO: noreply@example.com
        GITLAB_INCOMING_EMAIL_ADDRESS: reply@example.com
        GITLAB_BACKUP_SCHEDULE: daily
        GITLAB_BACKUP_TIME: "01:00"
        SMTP_ENABLED: "false"
        SMTP_DOMAIN: www.example.com
        SMTP_HOST: smtp.gmail.com
        SMTP_PORT: "587"
        SMTP_USER: mailer@example.com
        SMTP_STARTTLS: "true"
        SMTP_AUTHENTICATION: login
        IMAP_ENABLED: "false"
        IMAP_HOST: imap.gmail.com
        IMAP_PORT: "993"
        IMAP_USER: mailer@example.com
        IMAP_SSL: "true"
        IMAP_STARTTLS: "false"
        OAUTH_ENABLED: "false"
        OAUTH_AUTO_SIGN_IN_WITH_PROVIDER: ""
        OAUTH_ALLOW_SSO: ""
        OAUTH_BLOCK_AUTO_CREATED_USERS: "true"
        OAUTH_AUTO_LINK_LDAP_USER: "false"
        OAUTH_AUTO_LINK_SAML_USER: "false"
        OAUTH_EXTERNAL_PROVIDERS: ""
        OAUTH_CAS3_LABEL: cas3
        OAUTH_CAS3_SERVER: ""
        OAUTH_CAS3_DISABLE_SSL_VERIFICATION: "false"
        OAUTH_CAS3_LOGIN_URL: /cas/login
        OAUTH_CAS3_VALIDATE_URL: /cas/p3/serviceValidate
        OAUTH_CAS3_LOGOUT_URL: /cas/logout
        OAUTH_GOOGLE_API_KEY: ""
        OAUTH_GOOGLE_RESTRICT_DOMAIN: ""
        OAUTH_FACEBOOK_API_KEY: ""
        OAUTH_TWITTER_API_KEY: ""
        OAUTH_GITHUB_API_KEY: ""
        OAUTH_GITHUB_URL: ""
        OAUTH_GITHUB_VERIFY_SSL: ""
        OAUTH_GITLAB_API_KEY: ""
        OAUTH_BITBUCKET_API_KEY: ""
        OAUTH_BITBUCKET_URL: ""
        OAUTH_SAML_ASSERTION_CONSUMER_SERVICE_URL: ""
        OAUTH_SAML_IDP_CERT_FINGERPRINT: ""
        OAUTH_SAML_IDP_SSO_TARGET_URL: ""
        OAUTH_SAML_ISSUER: ""
        # The quotes are part of the value, as compose passes it.
        OAUTH_SAML_LABEL: '"Our SAML Provider"'
        OAUTH_SAML_NAME_IDENTIFIER_FORMAT: urn:oasis:names:tc:SAML:2.0:nameid-format:transient
        OAUTH_SAML_GROUPS_ATTRIBUTE: ""
        OAUTH_SAML_EXTERNAL_GROUPS: ""
        OAUTH_SAML_ATTRIBUTE_STATEMENTS_EMAIL: ""
        OAUTH_SAML_ATTRIBUTE_STATEMENTS_NAME: ""
        OAUTH_SAML_ATTRIBUTE_STATEMENTS_USERNAME: ""
        OAUTH_SAML_ATTRIBUTE_STATEMENTS_FIRST_NAME: ""
        OAUTH_SAML_ATTRIBUTE_STATEMENTS_LAST_NAME: ""
        OAUTH_CROWD_SERVER_URL: ""
        OAUTH_CROWD_APP_NAME: ""
        OAUTH_AUTH0_CLIENT_ID: ""
        OAUTH_AUTH0_DOMAIN: ""
        OAUTH_AUTH0_SCOPE: ""
        OAUTH_AZURE_API_KEY: ""
        OAUTH_AZURE_TENANT_ID: ""
      secrets:
        credentials:
          string_data:
            GITLAB_SECRETS_DB_KEY_BASE:
              value: ${applications.gitlab.db_key_base}
            GITLAB_SECRETS_SECRET_KEY_BASE:
              value: ${applications.gitlab.secret_key_base}
            GITLAB_SECRETS_OTP_KEY_BASE:
              value: ${applications.gitlab.otp_key_base}
            GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
              value: ${applications.gitlab.active_record_encryption_primary_key}
            GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
              value: ${applications.gitlab.active_record_encryption_deterministic_key}
            GITLAB_SECRETS_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
              value: ${applications.gitlab.active_record_encryption_key_derivation_salt}
      # The image's template of resque.yml with Valkey's password, which
      # GitLab reads through ERB from REDIS_PASSWORD (DEC-357). The image
      # copies the template at start and fills in the {{...}} from REDIS_HOST,
      # REDIS_PORT and REDIS_DB_NUMBER.
      config_maps:
        redis:
          mount: /etc/docker-gitlab/runtime/config/gitlabhq/resque.yml
          subPath: resque.yml
          readOnly: true
          data:
            resque.yml:
              value: |
                production:
                  url: redis://:<%= ERB::Util.url_encode(ENV["REDIS_PASSWORD"]) %>@{{REDIS_HOST}}:{{REDIS_PORT}}/{{REDIS_DB_NUMBER}}
      # /users/sign_in on port http in place of the compose file's
      # healthcheck (DEC-358), with its interval, timeout and retries. The
      # startup probe holds back the readiness probe for up to an hour, while
      # the first start sets up the database.
      healthcheck:
        startup:
          type: http
          port: http
          path: /users/sign_in
          timeout_seconds: 10
          failure_threshold: 360
        readiness:
          type: http
          port: http
          path: /users/sign_in
          period_seconds: 300
          timeout_seconds: 10
      volume_mounts:
        data:
          mount_path: /home/git/data
      volume_claims:
        data:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
