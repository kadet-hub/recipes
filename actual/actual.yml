parameters:
  components:
    actual:
      application: actual
      type: statefulset
      # renovate: upstream
      image: docker.io/actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
      ports:
        http:
          container_port: 5006
          service_port: 5006
      service:
        type: ClusterIP
      # The compose healthcheck, with its interval, timeout and retries.
      healthcheck:
        readiness:
          type: command
          command:
            - sh
            - -c
            - node scripts/health-check.js
          period_seconds: 60
          timeout_seconds: 10
      volume_mounts:
        actual-data:
          mount_path: /data
      volume_claims:
        actual-data:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
