classes:
  - .stalwart
  - .stalwart-apply
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    stalwart:
      # The target sets domain, admin.password, mailbox.name and
      # mailbox.password.
      hostname: mail.${applications.stalwart.domain}
      admin:
        name: admin
      dkim:
        selector: stalwart
      dmarc:
        policy: quarantine
      mta_sts:
        mode: testing
        id: "1"
      # Lines the options add to the plan of stalwart-apply. Stalwart skips
      # blank lines.
      plan:
        relay: ""
