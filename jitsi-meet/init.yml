classes:
  - .web
  - .prosody
  - .jicofo
  - .jvb
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.14.0@sha256:787129e1eaed6b9bc868fe4c4aec58d40de6a89fc3cc08424a4cb5822b855080
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    jitsi-meet:
      # The target sets jicofo_auth_password, jvb_auth_password and
      # moderator_password.
      cluster_domain: cluster.local
      component_defaults:
        # Compose injects no service link variables.
        enable_service_links: false
        # read_only: true of every service.
        read_only_root_filesystem: true
  generators:
    kubernetes:
      secrets:
        jitsi-meet:
          string_data:
            JICOFO_AUTH_PASSWORD:
              value: ${applications.jitsi-meet.jicofo_auth_password}
            JVB_AUTH_PASSWORD:
              value: ${applications.jitsi-meet.jvb_auth_password}
            MODERATOR_PASSWORD:
              value: ${applications.jitsi-meet.moderator_password}
