classes:
  - .keycloak-operator
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.9.0@sha256:987694d4d8b061a6937fb5b8acd17416a16ed3fea36786a7604e6d607c210e24
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    keycloak-operator:
      # The default image of a Keycloak resource that sets none.
      keycloak_image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
      # The chart's build annotations, as 26.8.1 renders them. They change
      # with each rebuild of the release.
      annotations:
        app.quarkus.io/quarkus-version: 3.40.1
        app.quarkus.io/commit-id: 24ed1dadf3f246a555adb6d3d4a99e9b3003fb3b
        app.quarkus.io/vcs-uri: https://github.com/keycloak/keycloak.git
        app.quarkus.io/build-timestamp: 2026-10-31 - 10:48:34 +0000
      service_accounts:
        - ${namespace}/keycloak-operator
