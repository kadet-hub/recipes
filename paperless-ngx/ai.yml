parameters:
  # The target sets applications.paperless-ngx.ai.user, .token, .url, .model,
  # .api_key and .jwt_secret.
  components:
    paperless-ngx-ai:
      application: paperless-ngx
      type: statefulset
      image: docker.io/clusterzx/paperless-ai:4.1.0@sha256:ccc6cb3ef433ccf3bcf8ed5d27cb0d0e0802d3f567a80c2fae90ae7e7b6d32cd
      ports:
        http:
          container_port: 3000
          service_port: 3000
      service:
        type: ClusterIP
      # paperless-ai reads these on every start, and they win over its
      # /app/data/config.json.
      env:
        PAPERLESS_API_URL: http://paperless-ngx:8000/api
        PAPERLESS_USERNAME: ${applications.paperless-ngx.ai.user}
        PAPERLESS_API_TOKEN:
          secretKeyRef:
            key: PAPERLESS_API_TOKEN
        AI_PROVIDER: custom
        CUSTOM_BASE_URL: ${applications.paperless-ngx.ai.url}
        CUSTOM_MODEL: ${applications.paperless-ngx.ai.model}
        CUSTOM_API_KEY:
          secretKeyRef:
            key: CUSTOM_API_KEY
        JWT_SECRET:
          secretKeyRef:
            key: JWT_SECRET
      # The image's HEALTHCHECK. /health checks paperless-ai's own database.
      healthcheck:
        readiness:
          type: command
          command:
            - sh
            - -c
            - node -e "fetch('http://127.0.0.1:'+(process.env.PAPERLESS_AI_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          period_seconds: 30
          timeout_seconds: 10
      # As paperless-ai's own compose file: cap_drop ALL, no-new-privileges.
      security_context:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      # The key env is the seed /app/data/.env. paperless-ai reads it only
      # while config.json does not exist and then marks the setup complete,
      # which no variable does.
      secrets:
        settings:
          mount: /app/data/.env
          subPath: env
          readOnly: true
          string_data:
            env:
              value: |
                PAPERLESS_API_URL=http://paperless-ngx:8000/api
                PAPERLESS_API_TOKEN=${applications.paperless-ngx.ai.token}
            PAPERLESS_API_TOKEN:
              value: ${applications.paperless-ngx.ai.token}
            CUSTOM_API_KEY:
              value: ${applications.paperless-ngx.ai.api_key}
            JWT_SECRET:
              value: ${applications.paperless-ngx.ai.jwt_secret}
      volume_mounts:
        data:
          mount_path: /app/data
      volume_claims:
        data:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
