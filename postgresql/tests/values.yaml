version:
  postgresql: "18"
cluster:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:44d17e8570dc25055376148a2918840def5bef0193969be3e79101afa25eafc2
  # The defaults CloudNativePG gives an empty initdb, which the recipe
  # sets so a target can change them.
  initdb:
    database: app
    owner: app
    # The options pgvector and earthdistance.
    postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS vector
      - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE
