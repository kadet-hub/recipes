parameters:
  components:
    gitea:
      application: gitea
      # renovate: upstream
      image: docker.gitea.com/gitea:28.3.0-rootless@sha256:40c5a68a0463c0940e1ae32626c8300dd0572f3558e390073ad8379ca67c0e1d
      update_strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 100%
      grace_period: 60
      labels: ${applications.gitea.labels}
      pod_labels: ${applications.gitea.labels}
      # The chart's hash of its templates/gitea/config.yaml as tests/values.yaml
      # renders it. It does not follow a change of the recipe or the target.
      pod_annotations:
        checksum/config: d873db5a3662c25872dcfed561068ff264a62ac471ebf2e26e55817417a734ae
      # The chart leaves the token to the default ServiceAccount, which mounts it.
      automount_service_account_token: true
      workload_security_context:
        fsGroup: 1000
      # The chart's containerSecurityContext of tests/values.yaml.
      security_context:
        runAsNonRoot: true
      env:
        SSH_LISTEN_PORT: ${components.gitea.ports.ssh.container_port}
        SSH_PORT: ${components.gitea.ports.ssh.service_port}
        GITEA_APP_INI: /data/gitea/conf/app.ini
        GITEA_CUSTOM: /data/gitea
        GITEA_WORK_DIR: /data
        GITEA_TEMP: /tmp/gitea
        TMPDIR: ${components.gitea.env.GITEA_TEMP}
        HOME: /data/gitea/git
      ports:
        http:
          service_port: 3000
          # The chart sets no appProtocol.
          app_protocol: ""
        ssh:
          service_port: 22
          container_port: 2222
      service:
        service_name: gitea-http
        headless: true
        expose_ports:
          - http
      additional_services:
        gitea-ssh:
          headless: true
          expose_ports:
            - ssh
      healthcheck:
        liveness:
          type: tcp
          port: http
          initial_delay_seconds: 200
          timeout_seconds: 1
          failure_threshold: 10
        readiness:
          type: tcp
          port: http
          initial_delay_seconds: 5
          timeout_seconds: 1
      volumes:
        init:
          secret:
            secretName: gitea-init
            defaultMode: 110
        config:
          secret:
            secretName: gitea
            defaultMode: 110
        inline-config-sources:
          secret:
            secretName: gitea-inline-config
        temp:
          emptyDir: {}
        data:
          persistentVolumeClaim:
            claimName: gitea-shared-storage
      volume_mounts:
        temp:
          mount_path: /tmp
        data:
          mount_path: /data
      persistent_volume_claims:
        gitea-shared-storage:
          storage: 10Gi
      init_containers:
        init-directories:
          image: ${components.gitea.image}
          command:
            - ${applications.gitea.scripts}/init_directory_structure.sh
          env:
            GITEA_APP_INI: ${components.gitea.env.GITEA_APP_INI}
            GITEA_CUSTOM: ${components.gitea.env.GITEA_CUSTOM}
            GITEA_WORK_DIR: ${components.gitea.env.GITEA_WORK_DIR}
            GITEA_TEMP: ${components.gitea.env.GITEA_TEMP}
          volume_mounts:
            init:
              mount_path: ${applications.gitea.scripts}
            temp: ${components.gitea.volume_mounts.temp}
            data: ${components.gitea.volume_mounts.data}
          security_context: ${components.gitea.security_context}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        # Writes app.ini from gitea-inline-config, then from the GITEA__*
        # variables, which win.
        init-app-ini:
          image: ${components.gitea.image}
          command:
            - ${applications.gitea.scripts}/config_environment.sh
          env:
            GITEA_APP_INI: ${components.gitea.env.GITEA_APP_INI}
            GITEA_CUSTOM: ${components.gitea.env.GITEA_CUSTOM}
            GITEA_WORK_DIR: ${components.gitea.env.GITEA_WORK_DIR}
            GITEA_TEMP: ${components.gitea.env.GITEA_TEMP}
            TMP_EXISTING_ENVS_FILE: /tmp/existing-envs
            ENV_TO_INI_MOUNT_POINT: /env-to-ini-mounts
            GITEA__DATABASE__USER:
              secretKeyRef:
                name: ${applications.postgresql.cluster}-app
                key: username
            GITEA__DATABASE__PASSWD:
              secretKeyRef:
                name: ${applications.postgresql.cluster}-app
                key: password
            VALKEY_PASSWORD:
              secretKeyRef:
                name: valkey-auth
                key: default-password
            GITEA__CACHE__HOST: ${applications.gitea.valkey_url}
            GITEA__SESSION__PROVIDER_CONFIG: ${applications.gitea.valkey_url}
            GITEA__QUEUE__CONN_STR: ${applications.gitea.valkey_url}
          volume_mounts:
            config:
              mount_path: ${applications.gitea.scripts}
            temp: ${components.gitea.volume_mounts.temp}
            data: ${components.gitea.volume_mounts.data}
            inline-config-sources:
              mount_path: ${components.gitea.init_containers.init-app-ini.env.ENV_TO_INI_MOUNT_POINT}/inlines/
          security_context: ${components.gitea.security_context}
          resources: ${components.gitea.init_containers.init-directories.resources}
        # Migrates the database and creates the admin account, or sets its
        # password (gitea.admin.passwordMode keepUpdated).
        configure-gitea:
          image: ${components.gitea.image}
          command:
            - ${applications.gitea.scripts}/configure_gitea.sh
          security_context:
            runAsNonRoot: ${components.gitea.security_context.runAsNonRoot}
            runAsUser: 1000
          env:
            GITEA_APP_INI: ${components.gitea.env.GITEA_APP_INI}
            GITEA_CUSTOM: ${components.gitea.env.GITEA_CUSTOM}
            GITEA_WORK_DIR: ${components.gitea.env.GITEA_WORK_DIR}
            GITEA_TEMP: ${components.gitea.env.GITEA_TEMP}
            HOME: ${components.gitea.env.HOME}
            GITEA_ADMIN_USERNAME:
              secretKeyRef:
                name: gitea-admin
                key: username
            GITEA_ADMIN_PASSWORD:
              secretKeyRef:
                name: gitea-admin
                key: password
            GITEA_ADMIN_PASSWORD_MODE: keepUpdated
          volume_mounts:
            init:
              mount_path: ${applications.gitea.scripts}
            temp: ${components.gitea.volume_mounts.temp}
            data: ${components.gitea.volume_mounts.data}
          resources: ${components.gitea.init_containers.init-directories.resources}
  generators:
    kubernetes:
      # Component Secrets would also be mounted as volumes.
      secrets:
        gitea-admin:
          string_data:
            username:
              value: ${applications.gitea.admin.username}
            password:
              value: ${applications.gitea.admin.password}
        # The chart's gitea.config, which init-app-ini writes into app.ini.
        gitea-inline-config:
          labels: ${applications.gitea.labels}
          string_data:
            _generals_:
              value: ""
            cache:
              value: |-
                ADAPTER=redis
                HOST=
            database:
              value: |-
                DB_TYPE=postgres
                HOST=${applications.postgresql.cluster}-rw:5432
                NAME=${applications.postgresql.database}
                SSL_MODE=require
            indexer:
              value: ISSUE_INDEXER_TYPE=db
            metrics:
              value: ENABLED=false
            queue:
              value: |-
                CONN_STR=
                TYPE=redis
            repository:
              value: ROOT=/data/git/gitea-repositories
            security:
              value: |-
                INSTALL_LOCK=true
                INTERNAL_TOKEN=${applications.gitea.internal_token}
                SECRET_KEY=${applications.gitea.secret_key}
            server:
              value: |-
                APP_DATA_PATH=/data
                DOMAIN=git.example.com
                ENABLE_PPROF=false
                HTTP_PORT=${components.gitea.ports.http.service_port}
                PROTOCOL=http
                ROOT_URL=http://git.example.com
                SSH_DOMAIN=git.example.com
                SSH_LISTEN_PORT=${components.gitea.ports.ssh.container_port}
                SSH_PORT=${components.gitea.ports.ssh.service_port}
                START_SSH_SERVER=true
            session:
              value: |-
                PROVIDER=redis
                PROVIDER_CONFIG=
        # From scripts/init-containers/config/ and templates/gitea/config.yaml
        # of the gitea chart 12.7.0, MIT (gitea.yml.LICENSE). The shell's
        # ${...} are written as ${escape:...}.
        gitea:
          labels: ${applications.gitea.labels}
          string_data:
            config_environment.sh:
              value: |
                #!/usr/bin/env bash
                set -euo pipefail

                function env2ini::log() {
                  printf "${escape:1}\n"
                }

                function env2ini::read_config_to_env() {
                  local section="${escape:1}"
                  local line="${escape:2}"

                  if [[ -z "${escape:line}" ]]; then
                    # skip empty line
                    return
                  fi

                  # 'xargs echo -n' trims all leading/trailing whitespaces and a trailing new line
                  local setting="$(awk -F '=' '{print $1}' <<< "${escape:line}" | xargs echo -n)"

                  if [[ -z "${escape:setting}" ]]; then
                    env2ini::log '  ! invalid setting'
                    exit 1
                  fi

                  local value=''
                  local regex="^${escape:setting}(\s*)=(\s*)(.*)"
                  if [[ $line =~ $regex ]]; then
                    value="${escape:'BASH_REMATCH[3]'}"
                  else
                    env2ini::log '  ! invalid setting'
                    exit 1
                  fi

                  env2ini::log "    + '${escape:setting}'"

                  if [[ -z "${escape:section}" ]]; then
                    export "GITEA____${escape:'setting^^'}=${escape:value}"                           # '^^' makes the variable content uppercase
                    return
                  fi

                  local masked_section="${escape:'section//./_0X2E_'}"                            # '//' instructs to replace all matches
                  masked_section="${escape:'masked_section//-/_0X2D_'}"

                  export "GITEA__${escape:'masked_section^^'}__${escape:'setting^^'}=${escape:value}"        # '^^' makes the variable content uppercase
                }

                function env2ini::reload_preset_envs() {
                  env2ini::log "Reloading preset envs..."

                  while read -r line; do
                    if [[ -z "${escape:line}" ]]; then
                      # skip empty line
                      return
                    fi

                    # 'xargs echo -n' trims all leading/trailing whitespaces and a trailing new line
                    local setting="$(awk -F '=' '{print $1}' <<< "${escape:line}" | xargs echo -n)"

                    if [[ -z "${escape:setting}" ]]; then
                      env2ini::log '  ! invalid setting'
                      exit 1
                    fi

                    local value=''
                    local regex="^${escape:setting}(\s*)=(\s*)(.*)"
                    if [[ $line =~ $regex ]]; then
                      value="${escape:'BASH_REMATCH[3]'}"
                    else
                      env2ini::log '  ! invalid setting'
                      exit 1
                    fi

                    env2ini::log "  + '${escape:setting}'"

                    export "${escape:'setting^^'}=${escape:value}"                           # '^^' makes the variable content uppercase
                  done < "$TMP_EXISTING_ENVS_FILE"

                  rm $TMP_EXISTING_ENVS_FILE
                }

                function env2ini::process_config_file() {
                  local config_file="${escape:1}"
                  local section="$(basename "${escape:config_file}")"

                  if [[ $section == '_generals_' ]]; then
                    env2ini::log "  [ini root]"
                    section=''
                  else
                    env2ini::log "  ${escape:section}"
                  fi

                  while read -r line; do
                    env2ini::read_config_to_env "${escape:section}" "${escape:line}"
                  done < <(awk 1 "${escape:config_file}")                             # Helm .toYaml trims the trailing new line which breaks line processing; awk 1 ... adds it back while reading
                }

                function env2ini::load_config_sources() {
                  local path="${escape:1}"

                  if [[ -d "${escape:path}" ]]; then
                    env2ini::log "Processing $(basename "${escape:path}")..."

                    while read -d '' configFile; do
                      env2ini::process_config_file "${escape:configFile}"
                    done < <(find "${escape:path}" -type l -not -name '..data' -print0)

                    env2ini::log "\n"
                  fi
                }

                function env2ini::generate_initial_secrets() {
                  # These environment variables will either be
                  #   - overwritten with user defined values,
                  #   - initially used to set up Gitea
                  # Anyway, they won't harm existing app.ini files

                  export GITEA__SECURITY__INTERNAL_TOKEN=$(gitea generate secret INTERNAL_TOKEN)
                  export GITEA__SECURITY__SECRET_KEY=$(gitea generate secret SECRET_KEY)
                  export GITEA__OAUTH2__JWT_SECRET=$(gitea generate secret JWT_SECRET)
                  export GITEA__SERVER__LFS_JWT_SECRET=$(gitea generate secret LFS_JWT_SECRET)

                  env2ini::log "...Initial secrets generated\n"
                }

                # save existing envs prior to script execution. Necessary to keep order of preexisting and custom envs
                env | (grep -e '^GITEA__' || [[ $? == 1 ]]) > $TMP_EXISTING_ENVS_FILE

                # MUST BE CALLED BEFORE OTHER CONFIGURATION
                env2ini::generate_initial_secrets

                env2ini::load_config_sources "$ENV_TO_INI_MOUNT_POINT/inlines/"
                env2ini::load_config_sources "$ENV_TO_INI_MOUNT_POINT/additionals/"

                # load existing envs to override auto generated envs
                env2ini::reload_preset_envs

                env2ini::log "=== All configuration sources loaded ===\n"

                # safety to prevent rewrite of secret keys if an app.ini already exists
                if [ -f ${escape:GITEA_APP_INI} ]; then
                  env2ini::log 'An app.ini file already exists. To prevent overwriting secret keys, these settings are dropped and remain unchanged:'
                  env2ini::log '  - security.INTERNAL_TOKEN'
                  env2ini::log '  - security.SECRET_KEY'
                  env2ini::log '  - oauth2.JWT_SECRET'
                  env2ini::log '  - server.LFS_JWT_SECRET'

                  unset GITEA__SECURITY__INTERNAL_TOKEN
                  unset GITEA__SECURITY__SECRET_KEY
                  unset GITEA__OAUTH2__JWT_SECRET
                  unset GITEA__SERVER__LFS_JWT_SECRET
                fi

                gitea config edit-ini --apply-env --config "$GITEA_APP_INI" --out "$GITEA_APP_INI"
            assertions:
              value: ""
        # From scripts/init-containers/init/ and templates/gitea/init.yaml of
        # the gitea chart 12.7.0, MIT (gitea.yml.LICENSE), rendered without
        # signing, LDAP and OAuth. The shell's ${...} are written as
        # ${escape:...}.
        gitea-init:
          labels: ${applications.gitea.labels}
          string_data:
            configure_gpg_environment.sh:
              value: |
                #!/usr/bin/env bash
                set -eu

                gpg --batch --import "$TMP_RAW_GPG_KEY"
            init_directory_structure.sh:
              value: |-
                #!/usr/bin/env bash

                set -euo pipefail
                mkdir -pv /data/git/.ssh
                chmod -Rv 700 /data/git/.ssh
                [ ! -d /data/gitea/conf ] && mkdir -pv /data/gitea/conf

                # prepare temp directory structure
                mkdir -pv "${escape:GITEA_TEMP}"
                chmod -v ug+rwx "${escape:GITEA_TEMP}"
            configure_gitea.sh:
              value: |-
                #!/usr/bin/env bash

                set -euo pipefail

                echo '==== BEGIN GITEA CONFIGURATION ===='

                { # try
                  gitea migrate
                } || { # catch
                  echo "Gitea migrate might fail due to database connection...This init-container will try again in a few seconds"
                  exit 1
                }
                function configure_admin_user() {
                  local full_admin_list=$(gitea admin user list --admin)
                  local actual_user_table=''

                  # We might have distorted output due to warning logs, so we have to detect the actual user table by its headline and trim output above that line
                  local regex="(.*)(ID\s+Username\s+Email\s+IsActive.*)"
                  if [[ "${escape:full_admin_list}" =~ $regex ]]; then
                    actual_user_table=$(echo "${escape:'BASH_REMATCH[2]'}" | tail -n+2) # tail'ing to drop the table headline
                  else
                    # This code block should never be reached, as long as the output table header remains the same.
                    # If this code block is reached, the regex doesn't match anymore and we probably have to adjust this script.

                    echo "ERROR: 'configure_admin_user' was not able to determine the current list of admin users."
                    echo "       Please review the output of 'gitea admin user list --admin' shown below."
                    echo "       If you think it is an issue with the Helm Chart provisioning, file an issue at https://gitea.com/gitea/helm-gitea/issues."
                    echo "DEBUG: Output of 'gitea admin user list --admin'"
                    echo "--"
                    echo "${escape:full_admin_list}"
                    echo "--"
                    exit 1
                  fi

                  local ACCOUNT_ID=$(echo "${escape:actual_user_table}" | grep -E "\s+${escape:GITEA_ADMIN_USERNAME}\s+" | awk -F " " "{printf \$1}")
                  if [[ -z "${escape:ACCOUNT_ID}" ]]; then
                    local -a create_args
                    create_args=(--admin --username "${escape:GITEA_ADMIN_USERNAME}" --password "${escape:GITEA_ADMIN_PASSWORD}" --email "${applications.gitea.admin.email}")
                    if [[ "${escape:GITEA_ADMIN_PASSWORD_MODE}" = initialOnlyRequireReset ]]; then
                      create_args+=(--must-change-password=true)
                    else
                      create_args+=(--must-change-password=false)
                    fi
                    echo "No admin user '${escape:GITEA_ADMIN_USERNAME}' found. Creating now..."
                    gitea admin user create "${escape:'create_args[@]'}"
                    echo '...created.'
                  else
                    if [[ "${escape:GITEA_ADMIN_PASSWORD_MODE}" = keepUpdated ]]; then
                      echo "Admin account '${escape:GITEA_ADMIN_USERNAME}' already exist. Running update to sync password..."
                      # See https://gitea.com/gitea/helm-gitea/issues/673
                      # --must-change-password argument was added to change-password, defaulting to true, counter to the previous behavior
                      #   which acted as if it were provided with =false. If the argument is present in this version of gitea, then we
                      #   should add it to prevent requiring frequent admin password resets.
                      local -a change_args
                      change_args=(--username "${escape:GITEA_ADMIN_USERNAME}" --password "${escape:GITEA_ADMIN_PASSWORD}")
                      if gitea admin user change-password --help | grep -F -- '--must-change-password' >/dev/null; then
                        change_args+=(--must-change-password=false)
                      fi
                      gitea admin user change-password "${escape:'change_args[@]'}"
                      echo '...password sync done.'
                    else
                      echo "Admin account '${escape:GITEA_ADMIN_USERNAME}' already exist, but update mode is set to '${escape:GITEA_ADMIN_PASSWORD_MODE}'. Skipping."
                    fi
                  fi
                }

                configure_admin_user

                function configure_ldap() {
                    echo 'no ldap configuration... skipping.'
                }

                configure_ldap

                function configure_oauth() {
                    echo 'no oauth configuration... skipping.'
                }

                configure_oauth

                echo '==== END GITEA CONFIGURATION ===='
