classes:
  - recipes.postgresql
  - .mlflow
parameters:
  kapitan:
    dependencies:
      - type: oci
        source: ghcr.io/kadet-hub/kubernetes:1.16.0@sha256:7c6a790b21c8c378022a894f16850665092684326598f6974de65a3a4c4e44b7
        output_path: lib/kubernetes
    compile:
      - input_type: kadet
        input_paths:
          - lib/kubernetes
        output_path: manifests/
        output_type: yml
  applications:
    mlflow:
      # The target sets admin_password and secret_key.
      # Host headers the server accepts besides localhost and private
      # addresses: the Service's names in the cluster.
      allowed_hosts: mlflow-mlflow:5000,mlflow-mlflow.${namespace}:5000,mlflow-mlflow.${namespace}.svc:5000,mlflow-mlflow.${namespace}.svc.cluster.local:5000
